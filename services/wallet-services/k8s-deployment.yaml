apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: default
  labels:
    app: wallet-service
    version: v1
    component: microservice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
        version: v1
    spec:
      containers:
      - name: wallet-service
        image: wallet-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50055
          name: grpc
          protocol: TCP
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DB_NAME
          value: "userdb"
        - name: USER_SERVICE_ADDR
          value: "user-service:50051"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: wallet-secret
              key: encryption-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 50055
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 50055
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: default
  labels:
    app: wallet-service
    service: wallet-service
spec:
  type: ClusterIP
  ports:
  - port: 50055
    targetPort: 50055
    protocol: TCP
    name: grpc
  selector:
    app: wallet-service
---
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secret
  namespace: default
  labels:
    app: wallet-service
type: Opaque
data:
  # Base64 encoded: wallet-service-encryption-key-2024
  encryption-key: d2FsbGV0LXNlcnZpY2UtZW5jcnlwdGlvbi1rZXktMjAyNA==