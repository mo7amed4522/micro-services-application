apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
- k8s-deployment.yaml
- k8s-service.yaml
- k8s-configmap.yaml
- k8s-hpa.yaml
- k8s-networkpolicy.yaml
- k8s-servicemonitor.yaml
- k8s-pdb.yaml

commonLabels:
  app: wallet-service
  version: v1
  component: microservice

images:
- name: wallet-service
  newTag: latest

replicas:
- name: wallet-service
  count: 3

configMapGenerator:
- name: wallet-config
  literals:
  - DB_HOST=postgres-service
  - DB_PORT=5432
  - DB_NAME=userdb
  - USER_SERVICE_ADDR=user-service:50051
  - GRPC_PORT=50055

secretGenerator:
- name: wallet-secret
  literals:
  - encryption-key=wallet-service-encryption-key-2024