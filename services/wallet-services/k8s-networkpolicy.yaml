apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallet-service-netpol
  namespace: default
  labels:
    app: wallet-service
spec:
  podSelector:
    matchLabels:
      app: wallet-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway-service
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - protocol: TCP
      port: 50055
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - protocol: TCP
      port: 50051
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53