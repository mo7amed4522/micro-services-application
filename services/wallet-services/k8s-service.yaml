apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: default
  labels:
    app: wallet-service
    service: wallet-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  ports:
  - port: 50055
    targetPort: 50055
    protocol: TCP
    name: grpc
  selector:
    app: wallet-service
---
# Headless service for service discovery
apiVersion: v1
kind: Service
metadata:
  name: wallet-service-headless
  namespace: default
  labels:
    app: wallet-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 50055
    targetPort: 50055
    protocol: TCP
    name: grpc
  selector:
    app: wallet-service