apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-services
  namespace: microservices
  labels:
    app: user-services
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-services
  template:
    metadata:
      labels:
        app: user-services
        version: v1
    spec:
      containers:
      - name: user-services
        image: user-services:latest
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: user-services-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: user-services-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: user-services-config
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: user-services-secret
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: user-services-secret
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: user-services-secret
              key: jwt-secret
        - name: TWILIO_WHATSAPP_NUMBER
          valueFrom:
            secretKeyRef:
              name: user-services-secret
              key: twilio-whatsapp-number
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "netstat -an | grep :50051 | grep LISTEN"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "netstat -an | grep :50051 | grep LISTEN"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always