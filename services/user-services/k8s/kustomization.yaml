apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices

resources:
- deployment.yaml
- service.yaml
- configmap.yaml
- secret.yaml
- hpa.yaml
- networkpolicy.yaml
- pdb.yaml
- servicemonitor.yaml

commonLabels:
  app: user-services
  component: backend
  tier: microservice

images:
- name: user-services
  newTag: latest

replicas:
- name: user-services
  count: 3