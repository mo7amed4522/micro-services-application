apiVersion: v1
kind: Service
metadata:
  name: user-services
  namespace: microservices
  labels:
    app: user-services
spec:
  selector:
    app: user-services
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: user-services-headless
  namespace: microservices
  labels:
    app: user-services
spec:
  selector:
    app: user-services
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  clusterIP: None
  type: ClusterIP