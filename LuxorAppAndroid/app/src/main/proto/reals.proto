syntax = "proto3";

package reals;

option go_package = "./proto";

service RealsService {
    rpc CreateReal(CreateRealRequest) returns (CreateRealResponse);
    rpc GetUserReals(GetUserRealsRequest) returns (GetUserRealsResponse);
    rpc GetAllActiveReals(GetAllActiveRealsRequest) returns (GetAllActiveRealsResponse);
    rpc DeleteReal(DeleteRealRequest) returns (DeleteRealResponse);
    rpc ViewReal(ViewRealRequest) returns (ViewRealResponse);
}

message CreateRealRequest {
    string user_id = 1;
    repeated MediaItem media_items = 2;
}

message MediaItem {
    bytes file_data = 1;
    string file_name = 2;
    string content_type = 3;
    MediaType media_type = 4;
}

message CreateRealResponse {
    int32 status_code = 1;
    string message = 2;
    oneof result {
        RealSuccess success = 3;
        ErrorDetails error = 4;
    }
}

message RealSuccess {
    string real_id = 1;
    repeated string media_urls = 2;
    string expires_at = 3;
}

message GetUserRealsRequest {
    string user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message GetUserRealsResponse {
    int32 status_code = 1;
    string message = 2;
    oneof result {
        UserRealsSuccess success = 3;
        ErrorDetails error = 4;
    }
}

message UserRealsSuccess {
    repeated Real reals = 1;
    int32 total_count = 2;
}

message GetAllActiveRealsRequest {
    int32 limit = 1;
    int32 offset = 2;
    FetchStrategy strategy = 3;
}

message GetAllActiveRealsResponse {
    int32 status_code = 1;
    string message = 2;
    oneof result {
        AllRealsSuccess success = 3;
        ErrorDetails error = 4;
    }
}

message AllRealsSuccess {
    repeated Real reals = 1;
    int32 total_count = 2;
    bool from_cache = 3;
}

message DeleteRealRequest {
    string real_id = 1;
    string user_id = 2;
}

message DeleteRealResponse {
    int32 status_code = 1;
    string message = 2;
    oneof result {
        DeleteSuccess success = 3;
        ErrorDetails error = 4;
    }
}

message DeleteSuccess {
    string real_id = 1;
    string deleted_at = 2;
}

message ViewRealRequest {
    string real_id = 1;
    string viewer_user_id = 2;
}

message ViewRealResponse {
    int32 status_code = 1;
    string message = 2;
    oneof result {
        Real real = 3;
        ErrorDetails error = 4;
    }
}

message Real {
    string id = 1;
    string user_id = 2;
    string user_name = 3;
    string user_avatar = 4;
    repeated string media_urls = 5;
    repeated MediaType media_types = 6;
    string created_at = 7;
    string expires_at = 8;
    int32 view_count = 9;
    repeated string viewer_ids = 10;
}

message ErrorDetails {
    int32 code = 1;
    string message = 2;
    repeated string details = 3;
    string timestamp = 4;
}

enum MediaType {
    UNKNOWN = 0;
    IMAGE = 1;
    VIDEO = 2;
}

enum FetchStrategy {
    FAST_FETCH = 0;  
    CACHED_FETCH = 1; 
}