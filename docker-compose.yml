version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: user_postgres
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2521
    ports:
      - "5420:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - user_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service (GO)
  user-service:
    build:
      context: ./services/user-services
      dockerfile: Dockerfile
    container_name: user_service
    env_file:
      - ./services/user-services/.env
    environment:
      USER_SERVICE_ADDR: user-service:50051
      DB_HOST: postgres
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped

  # Auth Service (GO)
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-services/Dockerfile
    container_name: auth_service
    env_file:
      - ./services/auth-services/.env
    environment:
      USER_SERVICE_ADDR: user-service:50051
      FIREBASE_CREDENTIALS_PATH: ./firebase-credentials.json
    ports:
      - "50052:50052"
    depends_on:
      - user-service
    networks:
      - user_network
    restart: unless-stopped

  # Card Service (GO)
  card-service:
    build:
      context: .
      dockerfile: ./services/card-services/Dockerfile
    container_name: card_service
    env_file:
      - ./services/card-services/.env
    environment:
      USER_SERVICE_ADDR: user-service:50051
    ports:
      - "50053:50053"
    depends_on:
      - user-service
    networks:
      - user_network
    restart: unless-stopped

  # Transaction Service (GO)
  transaction-service:
    build:
      context: .
      dockerfile: ./services/transaction-services/Dockerfile
    container_name: transaction_service
    env_file:
      - ./services/transaction-services/.env
    environment:
      TRANSACTION_SERVICE_ADDR: transaction-service:50051
    ports:
      - "50054:50054"
    depends_on:
      - user-service
      - card-service
    networks:
      - user_network
    restart: unless-stopped

  # Wallet Service (GO)
  wallet-service:
    build:
      context: .
      dockerfile: ./services/wallet-services/Dockerfile
    container_name: wallet_service
    env_file:
      - ./services/wallet-services/.env
    environment:
      WALLET_SERVICE_URL: wallet-service:50051
    ports:
      - "50055:50055"
    depends_on:
      - user-service
      - postgres
    networks:
      - user_network
    restart: unless-stopped

  # Pharaoh Service (GO)
  pharaoh-service:
    build:
      context: ./services/pharaoh-services
      dockerfile: Dockerfile
    container_name: pharaoh_service
    env_file:
      - ./services/pharaoh-services/.env
    ports:
      - "50056:50056"
    environment:
      PHARAOH_SERVICE_ADDR: pharaoh-service:50056
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped

  # History Template Service (GO)
  history-template-service:
    build:
      context: ./services/history-template-services
      dockerfile: Dockerfile
    container_name: history_template_service
    env_file:
      - ./services/history-template-services/.env
    ports:
      - "50057:50057"
    environment:
      HISTORY_TEMPLATE_SERVICE_ADDR: history-template-service:50057
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped
  # Quiz  Service (GO)
  quiz-service:
    build:
      context: ./services/quiz-services
      dockerfile: Dockerfile
    container_name: quiz_service
    env_file:
      - ./services/quiz-services/.env
    ports:
      - "50058:50058"
    environment:
      QUIZ_SERVICE_ADDR: quiz-service:50058
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped
  # Feedback Service (GO)
  feedback-service:
    build:
      context: ./services/feedback-services
      dockerfile: Dockerfile
    container_name: feedback_service
    env_file:
      - ./services/feedback-services/.env
    ports:
      - "50059:50059"
    environment:
      FEEDBACK_SERVICE_ADDR: feedback-service:50059
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped

  # User Progress  Service (GO)
  user-progress-service:
    build:
      context: ./services/user-progress-services
      dockerfile: Dockerfile
    container_name: user_progress_service
    env_file:
      - ./services/user-progress-services/.env
    ports:
      - "50060:50060"
    environment:
      USER_PROGRESS_SERVICE_ADDR: user-progress-service:50060
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped

  # Chat Service (GO)
  chat-service:
    build:
      context: .
      dockerfile: ./services/chat-services/Dockerfile
    container_name: chat_service
    env_file:
      - ./services/chat-services/.env
    ports:
      - "50063:50063"
    environment:
      CHAT_SERVICE_ADDR: chat-service:50063
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - user_network
    restart: unless-stopped

  # Gateway Service (NestJS)
  gateway:
    build:
      context: ./getway
      dockerfile: Dockerfile
    container_name: api_gateway
    environment:
      USER_SERVICE_URL: user-service:50051
      AUTH_SERVICE_URL: auth-service:50052
      CARD_SERVICE_URL: card-service:50053
      TRANSACTION_SERVICE_URL: transaction-service:50054
      WALLET_SERVICE_URL: wallet-service:50055
      PHARAOH_SERVICE_URL: pharaoh-service:50056
      HISTORY_TEMPLATE_SERVICE_URL: history-template-service:50057
      QUIZ_SERVICE_URL: quiz-service:50058
      FEEDBACK_SERVICE_URL: feedback-service:50059
      USER_PROGRESS_SERVICE_URL: user-progress-service:50060
      CHAT_SERVICE_URL: chat-service:50063
      REALS_SERVICE_URL: reals-service:50062
      UPLOAD_SERVICE_URL: upload-service:50061
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - auth-service
      - card-service
      - transaction-service
      - wallet-service
      - pharaoh-service
      - history-template-service
      - quiz-service
      - feedback-service
      - user-progress-service
      - chat-service
      - reals-service
      - upload-service
    networks:
      - user_network
    restart: unless-stopped

  # Upload Service (GO)
  upload-service:
    build:
      context: ./services/upload-services
      dockerfile: Dockerfile
    container_name: upload_service
    env_file:
      - ./services/upload-services/.env
    ports:
      - "50061:50061"
    environment:
      UPLOAD_SERVICE_ADDR: upload-service:50061
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user_network
    restart: unless-stopped

  # Reals Service (GO) - NEW
  reals-service:
    build:
      context: ./services/reals-services
      dockerfile: Dockerfile
    container_name: reals_service
    env_file:
      - ./services/reals-services/.env
    ports:
      - "50062:50062"
    environment:
      REALS_SERVICE_ADDR: reals-service:50062
      UPLOAD_SERVICE_ADDR: upload-service:50061
      USER_SERVICE_ADDR: user-service:50051
      REDIS_ADDR: redis:6379
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      upload-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - user_network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - user_network
    restart: unless-stopped

  # Luxor Dashboard (React Frontend)
  luxor-dashboard:
    build:
      context: ./luxor_dashboard
      dockerfile: Dockerfile
    container_name: luxor_dashboard
    ports:
      - "8888:8888"
    environment:
      - REACT_APP_API_URL=http://localhost:8888
      - NODE_ENV=production
    depends_on:
      - gateway
    networks:
      - user_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  user_network:
    driver: bridge
